<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kart Kingdom — a joyful 3D kart racer</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏎️</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0a16; font-family: 'Comic Sans MS', 'Baloo 2', system-ui, -apple-system, sans-serif; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #boot { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; z-index: 50; transition: opacity .5s; background: linear-gradient(135deg,#1b3a6b,#0a1a3a 45%,#123a5e); }
      #boot::before { content:''; position:absolute; inset:0; background: radial-gradient(circle at 20% 20%, rgba(255,210,63,.18), transparent 45%), radial-gradient(circle at 80% 80%, rgba(79,209,197,.18), transparent 45%); }
      #boot.hidden { opacity: 0; pointer-events: none; }
      .boot-inner { position: relative; text-align: center; transform: translateY(-6%); }
      .boot-logo { font-size: 76px; line-height: 1; animation: boot-bounce 1.1s ease-in-out infinite; filter: drop-shadow(0 8px 18px rgba(0,0,0,.4)); }
      .boot-title { margin-top: 8px; font-size: 38px; font-weight: 800; letter-spacing: 2px; text-shadow: 0 4px 0 rgba(0,0,0,.3); }
      .boot-sub { margin-top: 2px; font-size: 14px; font-weight: 600; opacity: .85; letter-spacing: 3px; text-transform: uppercase; }
      .boot-bar { margin: 26px auto 0; width: min(420px, 76vw); height: 12px; border-radius: 999px; background: rgba(255,255,255,.14); overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,.35); position: relative; }
      .boot-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg,#ffb703,#ffd23f,#ffe08a,#ff9f43); background-size: 200% 100%; animation: boot-shimmer 1.2s linear infinite; transition: width .28s ease; }
      .boot-pct { margin-top: 8px; font-size: 22px; font-weight: 800; color: #ffd23f; text-shadow: 0 2px 6px rgba(0,0,0,.4); font-variant-numeric: tabular-nums; }
      .boot-text { margin-top: 2px; font-size: 13px; font-weight: 700; letter-spacing: 1px; opacity: .85; }
      .boot-footer { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; opacity: .55; }
      @keyframes boot-bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
      @keyframes boot-shimmer { 0%{background-position:0% 50%} 100%{background-position:200% 50%} }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <div class="boot-inner">
        <div class="boot-logo">🏎️</div>
        <div class="boot-title">Kart Kingdom</div>
        <div class="boot-sub">A joyful 3D kart racer</div>
        <div class="boot-bar"><div class="boot-fill" id="boot-fill"></div></div>
        <div class="boot-pct" id="boot-pct">0%</div>
        <div class="boot-text" id="boot-text">Loading…</div>
      </div>
      <div class="boot-footer" id="boot-footer">Kart Kingdom · v1.0</div>
    </div>
    <div id="diag" style="display:none"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

name: Build & deploy to GitHub Pages

# One Pages source per repo, so we build every branch into its own subfolder
# and publish a single combined site:
#     /      -> main (latest)
#     /pre   -> "pre"   branch (no boost/jump yet)
#     /boost -> "boost" branch (boost pads)
#     /jump  -> "jump"  branch (+ jump ramps)
# Runs on push to main; also runnable manually (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [main, pre, boost, jump]
        sub: [root, pre, boost, jump]
    steps:
    - name: Checkout ${{ matrix.branch }}
      uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}
        path: src-${{ matrix.sub }}
    - uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm
        cache-dependency-path: src-${{ matrix.sub }}/package-lock.json
    - name: Install
      working-directory: src-${{ matrix.sub }}
      run: npm ci || npm install --no-audit --no-fund
    - name: Vite build
      working-directory: src-${{ matrix.sub }}
      run: npm run build
    - name: Collect into site/
      if: matrix.sub == 'root'
      run: |
        mkdir -p site
        cp -r src-root/dist/* site/
        for s in pre boost jump; do
          mkdir -p "site/$s"
          cp -r "src-$s/dist/"* "site/$s"/ 2>/dev/null || echo "warn: src-$s/dist not found"
        done
        echo "=== published index.html files ==="
        find site -maxdepth 2 -name index.html -print
    - name: Upload Pages artifact
      if: matrix.sub == 'root'
      uses: actions/upload-pages-artifact@v3
      with:
        path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

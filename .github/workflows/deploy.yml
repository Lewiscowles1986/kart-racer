name: Build & deploy to GitHub Pages

# One Pages source per repo, so build every branch into its own subfolder and
# publish one combined site:
#       /       -> main (latest)
#       /pre    -> pre   branch (no boost/jump yet)
#       /boost  -> boost branch (boost pads)
#       /jump   -> jump  branch (+ jump ramps)
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
          with:
            fetch-depth: 0
        - uses: actions/setup-node@v4
          with:
            node-version: 20
            cache: npm
        - name: Build all branches into one site
          run: |
            set -euo pipefail
            mkdir -p site
            for b in main pre boost jump; do
              echo "=== building branch: $b ==="
              git worktree add --detach "wt-$b" "refs/remotes/origin/$b"
             (
                cd "wt-$b"
                npm ci || npm install --no-audit --no-fund
                npm run build
             )
              if [ "$b" = "main" ]; then
                cp -r "wt-$b/dist/"* "site/"
              else
                mkdir -p "site/$b"
                cp -r "wt-$b/dist/"* "site/$b/"
              fi
              git worktree remove --force "wt-$b"
            done
            echo "=== published index.html files ==="
            find site -maxdepth 2 -name index.html -print
        - uses: actions/configure-pages@v5
        - name: Upload single Pages artifact
          uses: actions/upload-pages-artifact@v3
          with:
            path: site

    deploy:
      needs: build
      runs-on: ubuntu-latest
      environment:
        name: github-pages
        url: ${{ steps.deployment.outputs.page_url }}
      steps:
        - name: Deploy to GitHub Pages
          id: deployment
          uses: actions/deploy-pages@v4
